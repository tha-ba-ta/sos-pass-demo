<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#56339a"><link rel="manifest" href="manifest.webmanifest"><title>SOS Pass • Via Emmaus</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#28213b;background:#f7f4fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#4e298d,#875ac2);color:white;padding:30px 20px 26px;border-radius:0 0 28px 28px}main{max-width:700px;margin:auto;padding:18px 16px 60px}h1{margin:0;font-size:30px}h2{font-size:20px;margin:8px 0 16px}.muted{color:#655d72}.card{background:white;border:1px solid #e9e2f3;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #4a31700b}button,a.action{font:inherit;border:0;border-radius:13px;background:#633ca6;color:white;padding:13px 16px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#eee8f7;color:#3b2367}button.danger{background:#bc3753}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2a900;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{min-height:74px;text-align:left}.small{font-size:13px}.pill{display:inline-block;border-radius:30px;background:#eee7fb;color:#56339a;padding:6px 10px;font-weight:650;font-size:12px}.hidden{display:none!important}.step{display:flex;align-items:flex-start;gap:10px;margin:12px 0}.step input{width:22px;height:22px;accent-color:#633ca6}input[type=text],input[type=time],textarea{width:100%;padding:12px;border:1px solid #cfc5df;border-radius:12px;font:inherit;margin:5px 0 12px}textarea{min-height:90px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav button{padding:9px 12px;background:#eee8f7;color:#44277d}.nav button.selected{background:#633ca6;color:white}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.note{border-left:4px solid #b18ad9;padding:10px;background:#f5f0fc;border-radius:8px}ul{padding-left:20px;line-height:1.7}p{line-height:1.55}@media(max-width:350px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="pill">VIA EMMAUS · SOS PASS</div><h1>Olá, viajante! ✈️</h1><p>Viagem de demonstração · dados fictícios</p><div>Um passo de cada vez. Você consegue. 💜</div></header><main><div class="nav" id="nav"></div><div id="view"></div></main><script>
const KEY='sospass_demo_v1';const initial={done:{},missions:{},routine:[{time:'07:00',name:'Acordar e conferir o plano do dia'},{time:'08:00',name:'Conferir celular, carteira, chaves e endereço'},{time:'21:00',name:'Preparar o dia seguinte'}],contacts:[{name:'Contato de confiança',phone:'',note:'Preencha o número em Configurar'}],notes:'',address:'Hospedagem de exemplo — endereço não cadastrado',school:'Escola de exemplo — endereço não cadastrado'};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(initial)};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let page='inicio';const pages=[['inicio','🏠 Início'],['viagem','✈️ Viagem'],['rotina','🕒 Rotina'],['ajuda','🆘 Ajuda'],['missoes','🎯 Missões'],['config','⚙️ Configurar']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){page=p;render();scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=pages.map(([k,t])=>`<button class="${page===k?'selected':''}" onclick="go('${k}')">${t}</button>`).join('');let v='';if(page==='inicio')v=`<div class="card"><span class="pill">PRÓXIMA ETAPA</span><h2>O que fazer agora?</h2><p>Abra <b>Rotina</b>, veja o horário e marque o que já fez. Se algo der errado, abra <b>Ajuda</b>.</p><div class="grid"><button onclick="go('rotina')">🕒 Minha rotina</button><button class="danger" onclick="go('ajuda')">🆘 Preciso de ajuda</button><button onclick="go('viagem')">✈️ Minha viagem</button><button onclick="go('missoes')">🎯 Minhas missões</button></div></div><div class="card"><h2>Antes de sair</h2>${checklist('sair',['Celular carregado','Carteira / cartão de transporte','Chaves','Endereço do destino salvo','Casaco adequado ao clima'])}</div>`;if(page==='viagem')v=`<div class="card"><h2>✈️ Ida</h2><p><b>Data ilustrativa · voo e horários não cadastrados</p><h2>✈️ Volta</h2><p><b>Data ilustrativa · voo e horários não cadastrados</p><p class="small muted">Confirme horários, terminal e portão com a companhia aérea.</p></div><div class="card"><h2>🏨 Hospedagens</h2><p>Hospedagem A · exemplo</p><p>Hospedagem B · exemplo</p><p>Hospedagem C · exemplo</p><p class="note">Endereços exatos e reservas devem ser conferidos antes do embarque.</p></div><div class="card"><h2>🎓 Escola e residência</h2><p><b>Escola:</b> ${esc(state.school)}</p><p><b>Residência:</b> ${esc(state.address)}</p><button onclick="go('config')">Atualizar endereços</button></div><div class="card"><h2>🧳 Checklist da viagem</h2>${checklist('documentos',['Passaporte válido','Documentos de entrada conferidos em fonte oficial','Passagem e reservas acessíveis','Seguro e contatos importantes','Celular, carregador e conexão de internet','Endereços disponíveis sem internet'])}</div>`;if(page==='rotina')v=`<div class="card"><h2>🕒 Minha rotina</h2><p class="muted">Horários iniciais de exemplo. Ajuste conforme a programação real da EF.</p>${state.routine.slice().sort((a,b)=>a.time.localeCompare(b.time)).map((x,i)=>`<div class="step"><input aria-label="Concluído" type="checkbox" ${state.done['rotina'+i]?'checked':''} onchange="toggle('rotina${i}',this.checked)"><div><b>${esc(x.time)} — ${esc(x.name)}</b></div></div>`).join('')}<button onclick="go('config')">Editar rotina</button></div><div class="card"><h2>Saindo sozinho</h2>${checklist('trajeto',['Sei o endereço para onde vou','Conferi o trajeto em aplicativo de mapas','Sei onde descer','Tenho um plano caso me perca'])}</div>`;if(page==='ajuda')v=`<div class="card"><h2>🆘 O que aconteceu?</h2><p>Escolha uma situação. Primeiro, tente o passo indicado. Se não resolver, procure uma pessoa de confiança.</p><div class="grid">${[['perdido','📍 Estou perdido'],['voltar','🚌 Não sei voltar'],['falar','💬 Não consigo explicar'],['nervoso','💜 Estou nervoso'],['objeto','📱 Perdi alguma coisa'],['emergencia','🚨 Emergência']].map(([k,t])=>`<button class="${k==='emergencia'?'danger':''}" onclick="help('${k}')">${t}</button>`).join('')}</div><div id="helpbox"></div></div><div class="card"><h2>Minha rede de apoio</h2>${state.contacts.map(x=>`<p><b>${esc(x.name)}</b> ${x.phone?`<a class="action" href="tel:${esc(x.phone.replace(/[^+0-9]/g,''))}">Ligar</a>`:'<span class="muted">Número ainda não cadastrado</span>'}<br><span class="small">${esc(x.note)}</span></p>`).join('')}<button onclick="go('config')">Editar contatos</button></div>`;if(page==='missoes')v=`<div class="card"><h2>🎯 Missões de autonomia</h2><p>Não precisa fazer tudo sozinho. Saber quando pedir ajuda também é autonomia.</p>${[['m1','Conferi minha mochila antes de sair'],['m2','Encontrei o trajeto para um lugar'],['m3','Fiz uma pergunta em inglês'],['m4','Resolvi um pequeno imprevisto'],['m5','Pedi ajuda quando precisei'],['m6','Preparei minhas coisas para amanhã']].map(([k,t])=>`<div class="step"><input type="checkbox" ${state.missions[k]?'checked':''} onchange="state.missions['${k}']=this.checked;save();render()"><span>${t}</span></div>`).join('')}<p class="pill">${Object.values(state.missions).filter(Boolean).length} missões realizadas</p></div>`;if(page==='config')v=`<div class="card"><h2>⚙️ Personalizar</h2><p class="note">Os dados são salvos somente neste navegador. Não coloque número de passaporte, senhas ou laudos aqui.</p><label>Escola<input id="school" type="text" value="${esc(state.school)}"></label><label>Endereço da residência<input id="address" type="text" value="${esc(state.address)}"></label><h2>Contato de confiança</h2><label>Nome<input id="contactname" type="text" value="${esc(state.contacts[0]?.name)}"></label><label>Telefone com DDI<input id="contactphone" type="text" value="${esc(state.contacts[0]?.phone)}"></label><h2>Rotina</h2><p class="small muted">Uma linha por atividade, no formato HH:MM | descrição</p><textarea id="routine">${esc(state.routine.map(x=>x.time+' | '+x.name).join('\n'))}</textarea><button onclick="storeSettings()">Salvar alterações</button></div><div class="card"><h2>Privacidade e cópia</h2><p>Sem conta, sem servidor e sem sincronização. Se limpar os dados do navegador, suas alterações podem desaparecer.</p><button class="secondary" onclick="exportData()">Exportar minhas configurações</button></div>`;document.getElementById('view').innerHTML=v}function checklist(id,items){return items.map((t,i)=>`<label class="step"><input type="checkbox" ${state.done[id+i]?'checked':''} onchange="toggle('${id+i}',this.checked)"><span>${esc(t)}</span></label>`).join('')}function toggle(k,val){state.done[k]=val;save()}function storeSettings(){state.school=document.getElementById('school').value;state.address=document.getElementById('address').value;state.contacts=[{name:document.getElementById('contactname').value,phone:document.getElementById('contactphone').value,note:'Contato autorizado'}];state.routine=document.getElementById('routine').value.split('\n').map(l=>l.split('|')).filter(a=>/^\d\d:\d\d$/.test((a[0]||'').trim())&&a[1]?.trim()).map(a=>({time:a[0].trim(),name:a.slice(1).join('|').trim()}));save();alert('Alterações salvas neste aparelho.');render()}function help(k){const guides={perdido:['Pare em um local seguro e movimentado.','Abra o mapa e confira onde você está.','Procure um funcionário identificado e mostre o endereço.','Se não resolver, ligue para seu contato de confiança.'],voltar:['Fique em um local seguro.','Abra o aplicativo de mapas e coloque o endereço da residência.','Confira a linha e o sentido do transporte antes de embarcar.','Se estiver inseguro, peça ajuda a um funcionário identificado.'],falar:['Mostre esta frase: “I need help. Could you please speak slowly?”','Mostre o endereço ou destino na tela.','Se necessário, ligue para seu contato.'],nervoso:['Vá para um local seguro e mais tranquilo.','Respire devagar e tome água, se possível.','Escolha uma única próxima ação.','Se precisar, ligue para alguém de confiança.'],objeto:['Pare e pense onde usou o objeto pela última vez.','Pergunte no balcão de achados e perdidos.','Se for cartão ou celular, peça ajuda para bloquear o acesso.','Avise um contato de confiança.'],emergencia:['Se houver perigo imediato no Canadá, ligue 911.','Diga onde você está e o que aconteceu.','Siga as instruções do atendente.','Quando estiver seguro, avise seu contato de confiança.']};document.getElementById('helpbox').innerHTML=`<div class="card"><h2>Faça isso → depois isso</h2><ol>${guides[k].map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${k==='emergencia'?'<a class="action" href="tel:911">Ligar 911</a>':''}<p><button class="secondary" onclick="go('ajuda')">Voltar</button></p></div>`}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sos-pass-demo-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
